services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      HEATING_CSV_PATH: /data/4heat_log.csv
      DJANGO_DB_DIR: /app/db
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-}
      TZ: Europe/Zurich
    volumes:
      - ./db:/app/db                              # journal + users: the only copy, back it up
      - ${HEATING_CSV_DIR:-./data}:/data:ro       # folder containing 4heat_log.csv (read-only)

  collector:
    build: .
    restart: unless-stopped
    # No shell: python is PID 1 and receives SIGTERM, so the logger stops cleanly.
    command: python -m fourheat_logger.main ${FOURHEAT_HOST:-192.168.1.182} --port ${FOURHEAT_PORT:-80} --output /data/4heat_log.csv
    environment:
      TZ: Europe/Zurich
    volumes:
      - ${HEATING_CSV_DIR:-./data}:/data          # writes 4heat_log.csv; web and telegram-com mount it read-only

  telegram-com:
    build: .
    restart: unless-stopped
    command: python manage.py run_alerts
    environment:
      HEATING_CSV_PATH: /data/4heat_log.csv
      DJANGO_DB_DIR: /app/db
      DATABASE_URL: ${DATABASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TZ: Europe/Zurich
    volumes:
      - ./db:/app/db
      - ${HEATING_CSV_DIR:-./data}:/data:ro
    depends_on:
      - web
